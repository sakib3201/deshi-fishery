services:
  app:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile
    restart: always
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://deshifishery.com
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=deshi_fishery
      - DB_USERNAME=deshi
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - SESSION_SECURE_COOKIE=true
      - QUEUE_CONNECTION=redis
      - GOTENBERG_URL=http://gotenberg:3000
    volumes:
      - ./backend/storage:/var/www/html/storage
      - ./backend/bootstrap/cache:/var/www/html/bootstrap/cache
    networks:
      - deshi-network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/html/public/frontend:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    networks:
      - deshi-network
    depends_on:
      - app

  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: deshi_fishery
      POSTGRES_USER: deshi
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - deshi-network

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - deshi-network

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: always
    command: ["gotenberg", "--api-port=3000", "--api-timeout=30s"]
    networks:
      - deshi-network
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  redis_data:

networks:
  deshi-network:
    driver: bridge
