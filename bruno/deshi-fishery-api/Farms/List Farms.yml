info:
  name: List Farms
  type: http
  seq: 1
  tags:
    - farms
    - protected
http:
  method: GET
  url: "{{baseUrl}}/api/v1/farms"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
    - name: Accept
      value: application/json
  auth:
    type: bearer
    bearer:
      token: "{{authToken}}"
runtime:
  tests:
    - name: returns 200 OK
      expr: res.getStatus() === 200
    - name: returns array
      expr: Array.isArray(res.getBody().data)
