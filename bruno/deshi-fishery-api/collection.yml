name: Deshi Fishery API
description: |
  API collection for Deshi Fishery - Fisheries management platform for Bangladeshi fish farmers.
  
  Base URL: {{baseUrl}}
  Version: v1
  
  Authentication: Bearer token (OAuth 2.0 via Laravel Passport)
  Multi-tenancy: X-Farm-ID header for farm scoping
variables:
  - name: baseUrl
    value: http://localhost:8080
    type: string
headers:
  - name: Accept
    value: application/json
  - name: Content-Type
    value: application/json
