meta {
  name: Create Pond
  type: http
  seq: 2
}

post {
  url: {{baseUrl}}/api/{{apiVersion}}/ponds
  body: json
  auth: bearer
}

headers {
  X-Farm-ID: {{farmId}}
}

auth:bearer {
  token: {{accessToken}}
}

body:json {
  {
    "pond_number": "Pond 1",
    "size": 0.5
  }
}

script:post-response {
  if (res.status === 201) {
    bru.setEnvVar("pondId", res.body.data.id);
  }
}
